{% extends "servicios/base.html" %}
{% block titulo %}Ingreso profesionales | Beauty Corner{% endblock %}
{% block contenido %}
<section class="gestion">
  <h1>Acceso profesionales</h1>
  {% if form.errors %}
    <p role="alert">Usuario o contraseña incorrectos.</p>
  {% endif %}
  <form method="post">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ next }}">
    <p>
      <label for="{{ form.username.id_for_label }}">Usuario</label>
      {{ form.username }}
    </p>
    <p>
      <label for="{{ form.password.id_for_label }}">Contraseña</label>
      {{ form.password }}
    </p>
    <button class="boton" type="submit">Ingresar</button>
  </form>
</section>
{% endblock %}
